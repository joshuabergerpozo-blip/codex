<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lueur — motion design</title>
<style>
  @font-face { font-family: "Fredoka"; src: url("../../assets/fredoka.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "Nunito"; src: url("../../assets/nunito.woff2") format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; background: #1b1530; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
/*
 * Film motion design « Lueur » — 24 s, 1280×720.
 * render(t) est déterministe : tools/motion/render.mjs l'appelle image par image
 * pour produire assets/lueur-motion.mp4. Ouvrir ce fichier seul le joue en boucle.
 */
const DURATION = 24;
const W = 1280, H = 720;
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeOutBack = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
// Apparition + disparition d'un élément : 0 → 1 → 0
const life = (t, inA, inB, outA, outB) => easeOut(seg(t, inA, inB)) * (1 - easeInOut(seg(t, outA, outB)));

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(",")})`; };
function ramp(stops, k) {
  for (let i = 0; i < stops.length - 1; i++) {
    const [p0, c0] = stops[i], [p1, c1] = stops[i + 1];
    if (k <= p1) return mix(c0, c1, (k - p0) / (p1 - p0));
  }
  return stops[stops.length - 1][1];
}
const toHex = (rgb) => "#" + rgb.match(/\d+/g).map((v) => (+v).toString(16).padStart(2, "0")).join("");

// Étoiles pseudo-aléatoires mais stables d'une image à l'autre
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const stars = Array.from({ length: 90 }, () => ({ x: rnd() * W, y: rnd() * H * 0.72, r: 0.6 + rnd() * 1.8, ph: rnd() * 6.28 }));

function text(str, x, y, { size = 64, color = "#fff6ea", alpha = 1, weight = 700, font = "Fredoka", align = "center", dy = 0, scale = 1 } = {}) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha);
  ctx.translate(x, y + dy);
  ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px "${font}"`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function sky(p) {
  const top = ramp([[0, "#1b1530"], [0.35, "#3b2150"], [0.7, "#f07a45"], [1, "#ffb56b"]], p);
  const bottom = ramp([[0, "#35224d"], [0.35, "#d9544a"], [0.7, "#ffb870"], [1, "#fff0d6"]], p);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(t, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  for (const s of stars) {
    ctx.globalAlpha = alpha * (0.45 + 0.55 * Math.abs(Math.sin(t * 1.4 + s.ph)));
    ctx.fillStyle = "#fff3dc";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function sun(x, y, r, p, t) {
  // halo
  const halo = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * (3.2 + p * 1.6));
  halo.addColorStop(0, `rgba(255,214,140,${0.55 * p + 0.15})`);
  halo.addColorStop(1, "rgba(255,160,90,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);
  // rayons arrondis
  if (p > 0.55) {
    const k = easeOut(seg(p, 0.55, 1));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.12);
    ctx.strokeStyle = `rgba(255,236,200,${0.55 * k})`;
    ctx.lineCap = "round";
    ctx.lineWidth = 10;
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(0, r + 26);
      ctx.lineTo(0, r + 26 + 34 * k);
      ctx.stroke();
    }
    ctx.restore();
  }
  const g = ctx.createRadialGradient(x, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, ramp([[0, "#ff9a6b"], [0.5, "#ffc36e"], [1, "#fff2cf"]], p));
  g.addColorStop(1, ramp([[0, "#e2553f"], [0.5, "#ff8a3d"], [1, "#ffc76a"]], p));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function hills(p) {
  const layers = [
    { base: 560, amp: 38, f: 0.006, off: 0.4, c0: "#2a1a3c", c1: "#f39a62" },
    { base: 610, amp: 30, f: 0.0085, off: 2.1, c0: "#221531", c1: "#e97b4a" },
    { base: 660, amp: 24, f: 0.011, off: 4.0, c0: "#1a1026", c1: "#d9643b" },
  ];
  for (const L of layers) {
    ctx.fillStyle = mix(L.c0, L.c1, p);
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, L.base - Math.sin(x * L.f + L.off) * L.amp - Math.sin(x * L.f * 2.3 + L.off) * L.amp * 0.3);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }
}

function vignette(strength) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, `rgba(20,8,20,${strength})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- Icônes des bénéfices ---------- */
function iconSun(x, y, s) {
  ctx.strokeStyle = "#fff6ea"; ctx.fillStyle = "#fff6ea"; ctx.lineWidth = 6 * s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y + 8 * s, 16 * s, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 30 * s, y + 10 * s); ctx.lineTo(x + 30 * s, y + 10 * s); ctx.stroke();
  for (const a of [-150, -120, -90, -60, -30]) {
    const r = (a * Math.PI) / 180;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(r) * 24 * s, y + 8 * s + Math.sin(r) * 24 * s);
    ctx.lineTo(x + Math.cos(r) * 32 * s, y + 8 * s + Math.sin(r) * 32 * s);
    ctx.stroke();
  }
}
function iconNotes(x, y, s, t) {
  ctx.strokeStyle = "#fff6ea"; ctx.fillStyle = "#fff6ea"; ctx.lineWidth = 6 * s; ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const h = (10 + 14 * Math.abs(Math.sin(t * 5 + i * 1.3))) * s;
    ctx.beginPath(); ctx.moveTo(x + (i - 1) * 16 * s, y - h); ctx.lineTo(x + (i - 1) * 16 * s, y + h); ctx.stroke();
  }
}
function iconMoon(x, y, s, bg) {
  ctx.fillStyle = "#fff6ea";
  ctx.beginPath(); ctx.arc(x, y, 22 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(x + 11 * s, y - 8 * s, 19 * s, 0, Math.PI * 2); ctx.fill();
}

function lamp(x, y, glow, t) {
  const pulse = 0.92 + 0.08 * Math.sin(t * 2.2);
  const halo = ctx.createRadialGradient(x, y, 40, x, y, 330 * pulse);
  halo.addColorStop(0, `rgba(255,236,190,${0.75 * glow})`);
  halo.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);
  // disque lumineux
  const g = ctx.createRadialGradient(x - 30, y - 40, 10, x, y, 150);
  g.addColorStop(0, mix("#ffd9b0", "#fffaf0", glow));
  g.addColorStop(0.7, mix("#ffb27a", "#ffe2b0", glow));
  g.addColorStop(1, mix("#f08a4b", "#ffc98a", glow));
  ctx.fillStyle = "#fbeee0";
  ctx.beginPath(); ctx.arc(x, y, 160, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 146, 0, Math.PI * 2); ctx.fill();
  // socle
  ctx.fillStyle = "#fbeee0";
  roundRect(x - 130, y + 150, 260, 56, 28); ctx.fill();
  ctx.fillStyle = "rgba(180,110,70,0.25)";
  roundRect(x - 44, y + 168, 88, 20, 10); ctx.fill();
  ctx.fillStyle = "#e0703a";
  text("06:30", x, y + 178, { size: 16, color: "#b8562c", font: "Nunito", weight: 800 });
}

/* ---------- Scènes ---------- */
function sceneNight(t) {
  sky(0);
  drawStars(t, 1);
  // lune
  ctx.fillStyle = "#f6e7cf";
  ctx.beginPath(); ctx.arc(1080, 130, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1e1733";
  ctx.beginPath(); ctx.arc(1098, 116, 34, 0, Math.PI * 2); ctx.fill();
  hills(0);

  const shake = t > 1.6 && t < 3.3 ? Math.sin(t * 70) * 9 * (1 - seg(t, 2.9, 3.3)) : 0;
  const clockA = life(t, 0.2, 1.0, 3.2, 3.7);
  text("06:30", 640 + shake, 300, { size: 200, alpha: clockA, dy: (1 - easeOut(seg(t, 0.2, 1.0))) * 30, color: t > 1.6 && t < 3.3 ? "#ff6b57" : "#fff6ea" });
  text("Votre corps dort encore.", 640, 430, { size: 36, font: "Nunito", weight: 700, alpha: life(t, 0.7, 1.4, 1.5, 1.7), color: "#f3d9c6" });

  const bip = life(t, 1.6, 1.8, 3.0, 3.3);
  if (bip > 0) {
    const words = ["BIP !", "BIP !", "BIP !"];
    words.forEach((w, i) => {
      const k = seg(t, 1.6 + i * 0.3, 1.75 + i * 0.3);
      text(w, 380 + i * 260 + Math.sin(t * 60 + i) * 6, 450 + Math.cos(t * 55 + i) * 5, { size: 64, alpha: bip * k, color: "#ff6b57", scale: 0.8 + 0.2 * easeOutBack(k) });
    });
  }
  const q = life(t, 3.6, 4.2, 4.9, 5.3);
  text("Et si votre réveil", 640, 320, { size: 72, alpha: q, dy: (1 - easeOut(seg(t, 3.6, 4.2))) * 24 });
  text("arrêtait de crier ?", 640, 405, { size: 72, alpha: q, dy: (1 - easeOut(seg(t, 3.7, 4.3))) * 24, color: "#ffb56b" });
}

function sceneSunrise(t) {
  const p = easeInOut(seg(t, 5.2, 12.4));
  sky(p);
  drawStars(t, 1 - seg(p, 0, 0.45));
  sun(640, lerp(800, 400, p), 110, p, t);
  hills(p);

  const l1 = life(t, 5.6, 6.4, 8.4, 8.9);
  text("30 minutes avant l'heure,", 640, 150, { size: 60, alpha: l1, dy: (1 - easeOut(seg(t, 5.6, 6.4))) * 20 });
  const l2 = life(t, 8.9, 9.7, 12.5, 13.0);
  text("Lueur fait lever le soleil", 640, 130, { size: 64, alpha: l2, dy: (1 - easeOut(seg(t, 8.9, 9.7))) * 20, color: mix("#fff6ea", "#7a2e17", seg(p, 0.6, 0.9)) });
  text("dans votre chambre.", 640, 205, { size: 64, alpha: l2, dy: (1 - easeOut(seg(t, 9.0, 9.8))) * 20, color: mix("#fff6ea", "#7a2e17", seg(p, 0.6, 0.9)) });

  // pastille : heure + intensité lumineuse
  const pill = life(t, 6.0, 6.6, 12.5, 13.0);
  if (pill > 0) {
    ctx.save();
    ctx.globalAlpha = pill;
    ctx.fillStyle = "rgba(255,246,234,0.92)";
    roundRect(470, 612, 340, 64, 32); ctx.fill();
    const minutes = Math.round(p * 30);
    text(`06:${String(minutes).padStart(2, "0")}`, 540, 644, { size: 30, color: "#7a2e17" });
    ctx.fillStyle = "#f3cdb2";
    roundRect(610, 636, 170, 16, 8); ctx.fill();
    ctx.fillStyle = ramp([[0, "#d9544a"], [0.5, "#ff8a3d"], [1, "#ffb14a"]], p);
    roundRect(610, 636, Math.max(16, 170 * p), 16, 8); ctx.fill();
    ctx.restore();
  }
}

function sceneFeatures(t) {
  const bg = "#ffe3c4";
  // fin du lever de soleil en fond puis balayage circulaire depuis le soleil
  sceneSunrise(Math.min(t, 12.99));
  const wipe = easeInOut(seg(t, 13.0, 13.8));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(640, 400, wipe * 1500, 0, Math.PI * 2); ctx.fill();

  const out = easeInOut(seg(t, 18.0, 18.5));
  text("Des matins enfin doux.", 640, 150, { size: 66, color: "#7a2e17", alpha: easeOut(seg(t, 13.5, 14.1)) * (1 - out), dy: (1 - easeOut(seg(t, 13.5, 14.1))) * 20 - out * 30 });

  const cards = [
    { t0: 13.9, title: "Aube progressive", sub: "de 10 à 60 minutes", icon: "sun", color: "#ff8a3d" },
    { t0: 14.5, title: "Sons de la nature", sub: "oiseaux, vagues, forêt", icon: "notes", color: "#f26b3a" },
    { t0: 15.1, title: "Crépuscule du soir", sub: "pour s'endormir sans écran", icon: "moon", color: "#d9544a" },
  ];
  cards.forEach((cd, i) => {
    const k = seg(t, cd.t0, cd.t0 + 0.6);
    if (k <= 0) return;
    const s = easeOutBack(k);
    const x = 240 + i * 400, y = 400 + out * 60;
    ctx.save();
    ctx.globalAlpha = clamp(k * 2) * (1 - out);
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = "rgba(122,46,23,0.08)";
    roundRect(-170, -104, 340, 230, 40); ctx.fill();
    ctx.fillStyle = "#fff7ee";
    roundRect(-170, -115, 340, 230, 40); ctx.fill();
    ctx.fillStyle = cd.color;
    ctx.beginPath(); ctx.arc(0, -40, 44, 0, Math.PI * 2); ctx.fill();
    if (cd.icon === "sun") iconSun(0, -44, 1);
    if (cd.icon === "notes") iconNotes(0, -40, 1, t);
    if (cd.icon === "moon") iconMoon(-3, -38, 1, cd.color);
    ctx.restore();
    text(cd.title, x, y + 42 * s, { size: 32, color: "#7a2e17", alpha: clamp(k * 2) * (1 - out) });
    text(cd.sub, x, y + 80 * s, { size: 22, font: "Nunito", weight: 700, color: "#b0673f", alpha: clamp(k * 2) * (1 - out) });
  });
  // bandeau science
  const sci = life(t, 16.0, 16.6, 18.0, 18.4);
  text("La lumière qui monte signale à votre corps qu'il est l'heure. Naturellement.", 640, 620, { size: 26, font: "Nunito", weight: 800, color: "#b0673f", alpha: sci });
}

function sceneFinal(t) {
  const g = ctx.createRadialGradient(420, 330, 50, 640, 360, 900);
  g.addColorStop(0, "#ffb45e");
  g.addColorStop(1, "#f06a33");
  ctx.fillStyle = "#ffe3c4";
  ctx.fillRect(0, 0, W, H);
  const reveal = easeInOut(seg(t, 18.3, 19.1));
  ctx.save();
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(420, 330, reveal * 1400, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const glow = easeInOut(seg(t, 18.8, 20.5));
  const lk = easeOutBack(seg(t, 18.6, 19.4));
  ctx.save();
  ctx.translate(420, 300);
  ctx.scale(lk, lk);
  ctx.translate(-420, -300);
  if (lk > 0) lamp(420, 300, glow, t);
  ctx.restore();

  const a1 = easeOut(seg(t, 19.4, 20.1));
  text("Lueur", 700, 250, { size: 150, align: "left", alpha: a1, dy: (1 - a1) * 30, color: "#fff6ea" });
  const a2 = easeOut(seg(t, 20.0, 20.7));
  text("Réveillez-vous du bon", 706, 360, { size: 44, align: "left", alpha: a2, dy: (1 - a2) * 20, color: "#fff6ea" });
  text("côté de la lumière.", 706, 414, { size: 44, align: "left", alpha: a2, dy: (1 - a2) * 20, color: "#5e210e" });
  const a3 = easeOutBack(seg(t, 20.8, 21.4));
  if (a3 > 0) {
    ctx.save();
    ctx.globalAlpha = clamp(a3);
    ctx.fillStyle = "#fff6ea";
    roundRect(706, 470, 360, 58, 29); ctx.fill();
    ctx.restore();
    text("Réveil simulateur d'aube", 886, 500, { size: 24, font: "Nunito", weight: 800, color: "#c2522a", alpha: clamp(a3), scale: 0.9 + 0.1 * a3 });
  }
  // retour à la nuit pour une boucle sans couture
  const night = easeInOut(seg(t, 23.3, 24));
  if (night > 0) {
    ctx.fillStyle = `rgba(27,21,48,${night})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  if (t < 5.2) {
    sceneNight(t);
    // fondu enchaîné vers l'aube
    if (t > 4.9) { ctx.save(); ctx.globalAlpha = seg(t, 4.9, 5.2); sceneSunrise(5.2); ctx.restore(); }
  } else if (t < 13) sceneSunrise(t);
  else if (t < 18.3) sceneFeatures(t);
  else sceneFinal(t);
  vignette(t < 13 ? 0.35 : 0.12);
}
window.render = render;
window.DURATION = DURATION;

Promise.all([document.fonts.load('700 64px "Fredoka"'), document.fonts.load('800 24px "Nunito"'), document.fonts.load('700 24px "Nunito"')]).then(() => {
  window.fontsReady = true;
  if (!new URLSearchParams(location.search).has("capture")) {
    const start = performance.now();
    const loop = (now) => { render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
