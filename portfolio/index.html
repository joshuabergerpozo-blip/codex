  { k: 'pdf', label: 'Lecteur PDF · Stages', icon: APP_ICONS.pdf, open: () => openNode('stage1') },
  { k: 'tiktok', label: 'TikTok Droit', icon: APP_ICONS.tiktok, open: () => openNode('tiktok') },
  { k: 'terminal', label: 'Terminal', icon: APP_ICONS.terminal, open: openTerminal },
];
const dock = $('#dock');
function refreshDock() {
  const mins = WM.list.filter(w => w.min);
  dock.innerHTML = DOCK.map(d => `<button class="dock-item${WM.list.some(w => w.app === d.k) ? ' running' : ''}" data-dock="${d.k}" aria-label="${esc(d.label)}">${d.icon()}<span class="tip">${esc(d.label)}</span></button>`).join('')
    + '<span class="dock-sep"></span>'
    + mins.map(w => `<button class="dock-item mini" data-win="${esc(w.key)}" aria-label="Rouvrir ${esc(w.title)}">${w.node ? iconSvg(w.node) : APP_ICONS[w.app === 'finder' ? 'finder' : 'info']()}<span class="tip">${esc(w.title)}</span></button>`).join('')
    + `<button class="dock-item" data-dock="trash" aria-label="Corbeille">${ICONS.trash(true)}<span class="tip">Corbeille</span></button>`;
}
dock.addEventListener('click', e => {
  const b = e.target.closest('.dock-item');
  if (!b) return;
  if (b.dataset.win) { const w = WM.list.find(x => x.key === b.dataset.win); if (w) restoreWin(w); return; }
  const k = b.dataset.dock;
  if (k === 'trash') return openFinder('trash');
  const wins = WM.list.filter(w => w.app === k);
  if (wins.length) {
    const top = [...wins].reverse().find(w => !w.min);
    if (top) focusWin(top); else restoreWin(wins[wins.length - 1]);
    return;
  }
  DOCK.find(d => d.k === k).open();
});
function bounceDock(app) {
  if (mqReduce.matches) return;
  const b = $(`#dock [data-dock="${app}"]`);
  if (!b || WM.list.some(w => w.app === app)) return;
  b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce');
  setTimeout(() => b.classList.remove('bounce'), 650);
}
dock.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || mqReduce.matches || isMobile()) return;
  $$('.dock-item', dock).forEach(it => {
    const r = it.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2));
    it.style.transform = `scale(${1 + .42 * Math.max(0, 1 - d / 110)})`;
  });
});
dock.addEventListener('pointerleave', () => $$('.dock-item', dock).forEach(it => { it.style.transform = ''; }));

/* =========================================================
   Notifications
   ========================================================= */
function toast(title, text, { icon, action, ms = 6000 } = {}) {
  const t = h(`<div class="toast" role="status">${icon || APP_ICONS.finder()}<div><b>${esc(title)}</b><p>${text}</p></div></div>`);
  const kill = () => { if (!t.isConnected) return; t.classList.add('out'); setTimeout(() => t.remove(), 250); };
  t.addEventListener('click', () => { action?.(); kill(); });
  $('#toasts').append(t);
  setTimeout(kill, ms);
}

/* =========================================================
   Recherche
   ========================================================= */
const spot = $('#spot'), spotQ = $('#spot-q'), spotRes = $('#spot-res');
let spotItems = [], spotIdx = 0;
const SPOT_POOL = () => [
  ...Object.keys(FS).filter(id => id !== 'desktop').map(id => ({ id, name: FS[id].name, sub: FS[id].desc || FS[id].type || '', kind: FS[id].type || 'Dossier', icon: iconSvg(id), go: () => openNode(id), hay: norm([FS[id].name, FS[id].desc, FS[id].type, FS[id].kw].join(' ')) })),
  { name: 'Changer l’apparence', sub: 'Mode clair ou sombre', kind: 'Action', icon: APP_ICONS.info(), go: toggleTheme, hay: 'apparence theme sombre clair dark light mode' },
  { name: 'À propos de JoshOS', sub: 'Infos système', kind: 'Action', icon: APP_ICONS.finder(), go: openAbout, hay: 'a propos joshos systeme' },
  { name: 'Raccourcis et astuces', sub: 'Aide', kind: 'Action', icon: APP_ICONS.info(), go: openHelp, hay: 'aide raccourcis clavier astuces help' },
];
function openSpot() { closeMenus(); spot.hidden = false; spotQ.value = ''; renderSpot(); spotQ.focus(); }
function closeSpot() { spot.hidden = true; }
function renderSpot() {
  const q = norm(spotQ.value.trim());
  const words = q.split(/\s+/).filter(Boolean);
  spotItems = SPOT_POOL().filter(it => words.every(w => it.hay.includes(w)));
  if (!q) spotItems = spotItems.filter(it => ['stage1', 'tiktok', 'coworking', 'heinz', 'ambitions', 'velo', 'saas'].includes(it.id));
  spotIdx = 0;
  spotRes.innerHTML = spotItems.length
    ? spotItems.map((it, i) => `<button class="spot-row${i === 0 ? ' on' : ''}" data-i="${i}" role="option">${it.icon}<span><b>${esc(it.name)}</b><small>${esc(it.sub)}</small></span><span class="k">${esc(it.kind)}</span></button>`).join('')
    : `<div class="spot-empty">Aucun résultat pour « ${esc(spotQ.value)} ».</div>`;
}
function spotMove(d) {
  if (!spotItems.length) return;
  spotIdx = (spotIdx + d + spotItems.length) % spotItems.length;
  $$('.spot-row', spotRes).forEach((r, i) => r.classList.toggle('on', i === spotIdx));
  $$('.spot-row', spotRes)[spotIdx].scrollIntoView({ block: 'nearest' });
}
spotQ.addEventListener('input', renderSpot);
spotQ.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); spotMove(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); spotMove(-1); }
  if (e.key === 'Enter' && spotItems[spotIdx]) { const it = spotItems[spotIdx]; closeSpot(); it.go(); }
});
spotRes.addEventListener('click', e => { const r = e.target.closest('.spot-row'); if (!r) return; const it = spotItems[+r.dataset.i]; closeSpot(); it.go(); });
spotRes.addEventListener('pointermove', e => { const r = e.target.closest('.spot-row'); if (r && +r.dataset.i !== spotIdx) { spotIdx = +r.dataset.i; $$('.spot-row', spotRes).forEach((x, i) => x.classList.toggle('on', i === spotIdx)); } });
spot.addEventListener('pointerdown', e => { if (e.target === spot) closeSpot(); });
$('#mb-search').innerHTML = UI.search;
$('#mb-search').addEventListener('click', () => spot.hidden ? openSpot() : closeSpot());

/* =========================================================
   Thème
   ========================================================= */
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mqDark.matches;
function setTheme(t) { root.dataset.theme = t; store.set('theme', t); }
function toggleTheme() { setTheme(isDark() ? 'light' : 'dark'); }
function paintThemeBtn() { $('#mb-theme').innerHTML = isDark() ? UI.sun : UI.moon; $('#mb-theme').setAttribute('aria-label', isDark() ? 'Passer en mode clair' : 'Passer en mode sombre'); }
const savedTheme = store.get('theme', null);
if (savedTheme) root.dataset.theme = savedTheme;
$('#mb-theme').addEventListener('click', toggleTheme);
new MutationObserver(() => { paintThemeBtn(); wall.refresh(); }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
mqDark.addEventListener?.('change', () => { paintThemeBtn(); wall.refresh(); });

/* =========================================================
   Fond d'écran : houle atlantique (canvas)
   ========================================================= */
const wall = (() => {
  const c = $('#wall'), ctx = c.getContext('2d');
  let W = 0, H = 0, cols = {}, raf = 0, last = 0;
  const hexA = (hex, a) => {
    const v = hex.replace('#', '');
    const n = parseInt(v.length === 3 ? v.split('').map(x => x + x).join('') : v, 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  };
  const read = () => { const cs = getComputedStyle(root); ['sky-1', 'sky-2', 'sea-1', 'sea-2', 'foam', 'sun'].forEach(k => { cols[k] = cs.getPropertyValue('--' + k).trim() || '#000000'; }); };
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  const draw = t => {
    const hz = Math.round(H * .57);
    let g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, cols['sky-1']); g.addColorStop(1, cols['sky-2']);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 1);
    const m = Math.min(W, H), sx = W * .7, sy = hz - m * .015, sr = m * .075;
    const glow = ctx.createRadialGradient(sx, sy, sr * .4, sx, sy, sr * 4);
    glow.addColorStop(0, hexA(cols.sun, .45)); glow.addColorStop(1, hexA(cols.sun, 0));
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, hz);
    ctx.fillStyle = cols.sun; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    g = ctx.createLinearGradient(0, hz, 0, H);
    g.addColorStop(0, cols['sea-1']); g.addColorStop(1, cols['sea-2']);
    ctx.fillStyle = g; ctx.fillRect(0, hz, W, H - hz);
    const L = 44;
    for (let i = 0; i < L; i++) {
      const p = i / (L - 1), y0 = hz + 2 + (H - hz) * Math.pow(p, 1.75);
      const amp = .6 + p * 7, wl = 34 + p * 280, sp = .5 + p * .9;
      ctx.beginPath();
      for (let x = -10; x <= W + 10; x += 6) {
        const y = y0 + Math.sin(x / wl + t * sp + i * 1.7) * amp * (.55 + .45 * Math.sin(x / (wl * 3.3) - t * .25 + i));
        x === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = hexA(cols.foam, .07 + p * .3);
      ctx.lineWidth = .6 + p * 1.5;
      ctx.stroke();
      const gw = sr * (.5 + p * 2.6) * (.75 + .25 * Math.sin(t * 1.3 + i * 2.1));
      ctx.strokeStyle = hexA(cols.sun, .55 * (1 - p) + .08);
      ctx.lineWidth = .8 + p * 1.8;
      ctx.beginPath(); ctx.moveTo(sx - gw, y0 + Math.sin(t + i) * amp * .4); ctx.lineTo(sx + gw, y0 + Math.sin(t + i) * amp * .4); ctx.stroke();
    }
  };
  const loop = now => {
    raf = requestAnimationFrame(loop);
    if (now - last < 33) return;
    last = now; draw(now / 1000 * .55);
  };
  const start = () => { cancelAnimationFrame(raf); if (mqReduce.matches || document.hidden) { draw(0); return; } raf = requestAnimationFrame(loop); };
  document.addEventListener('visibilitychange', start);
  return {
    init() { read(); size(); draw(0); start(); },
    resize() { size(); draw(last / 1000 * .55); },
    refresh() { read(); draw(last / 1000 * .55); },
  };
})();

/* =========================================================
   Horloge, clavier, redimensionnement
   ========================================================= */
function tick() {
  const d = new Date();
  const day = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  $('#clock').innerHTML = `<span class="d">${esc(day)}&nbsp;&nbsp;</span>${esc(time)}`;
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); spot.hidden ? openSpot() : closeSpot(); return; }
  if (e.key === 'Escape') {
    if (!spot.hidden) return closeSpot();
    if (openMenu) return closeMenus();
    const sh = WM.active && $('.sheet-bg', WM.active.el);
    if (sh) return sh.remove();
  }
  if (e.altKey && !e.metaKey && !e.ctrlKey) {
    if (e.code === 'KeyW' && WM.active) { e.preventDefault(); closeWin(WM.active); }
    if (e.code === 'KeyM' && WM.active) { e.preventDefault(); minimizeWin(WM.active); }
    if (e.code === 'KeyT') { e.preventDefault(); openTerminal(); }
  }
  const typing = e.target.closest?.('input, textarea');
  if (!typing && e.key === 'Enter' && document.activeElement === document.body && selectedIcons().length) selectedIcons().forEach(openNode);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open]');
  if (t && !t.closest('#icons')) openNode(t.dataset.open);
});

let rzT = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(rzT);
  rzT = requestAnimationFrame(() => {
    wall.resize();
    layoutIcons();
    const a = workArea();
    WM.list.forEach(w => {
      if (isMobile()) return;
      if (w.max) Object.assign(w.el.style, { left: '0px', top: a.y + 'px', width: innerWidth + 'px', height: (a.h + 2) + 'px' });
      else {
        const el = w.el;
        if (el.offsetWidth > innerWidth - 16) el.style.width = (innerWidth - 32) + 'px';
        if (el.offsetHeight > a.h) el.style.height = a.h - 8 + 'px';
        el.style.left = clamp(el.offsetLeft, 80 - el.offsetWidth, innerWidth - 80) + 'px';
        el.style.top = clamp(el.offsetTop, a.y, innerHeight - 70) + 'px';
      }
    });
  });
});
mqMobile.addEventListener?.('change', layoutIcons);

/* =========================================================
   Démarrage
   ========================================================= */
function openWelcome() {
  const a = workArea();
  const w = Math.min(620, innerWidth - 32), hh = Math.min(640, a.h - 24);
  const n = FS.lisezmoi;
  createWin({
    key: 'lisezmoi', node: 'lisezmoi', title: n.name, icon: iconSvg('lisezmoi'), app: 'notes', w, h: hh, body: n.render(),
    x: Math.round(clamp(innerWidth * .16, 16, Math.max(16, innerWidth - w - 260))), y: Math.round(a.y + 18),
  });
}
function welcomeToast() {
  toast('Bienvenue sur JoshOS', isMobile() ? 'Touchez une icône pour l’ouvrir. La loupe, en haut, cherche un projet.' : `Double-cliquez sur un dossier pour l’ouvrir. <kbd>${MOD} K</kbd> pour chercher un projet.`, { action: openHelp });
}
function bootScreen(onDone) {
  let b = $('#boot');
  if (!b) {
    b = h(`<div id="boot"><div class="boot-inner">${APP_ICONS.finder()}<div class="boot-name">JoshOS</div><div class="boot-bar"><i></i></div><div class="boot-hint">Cliquez pour passer</div></div></div>`);
    document.body.append(b);
  } else $('#boot-logo').outerHTML = APP_ICONS.finder();
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    b.classList.add('done');
    setTimeout(() => b.remove(), 520);
    onDone?.();
  };
  b.addEventListener('click', finish);
  setTimeout(finish, mqReduce.matches ? 0 : 1300);
}
function restart() {
  closeMenus();
  [...WM.list].forEach(w => { w.el.remove(); });
  WM.list = []; WM.active = null; WM.n = 0;
  blurWins(); refreshDock();
  bootScreen(() => { openWelcome(); setTimeout(welcomeToast, 700); });
}

$('#mb-logo').innerHTML = UI.logo;
paintThemeBtn();
refreshDock();
renderIcons();
wall.init();
tick(); setInterval(tick, 15000);
if (!isMobile()) openWelcome();

let booted = false;
try { booted = sessionStorage.getItem('joshos:boot') === '1'; sessionStorage.setItem('joshos:boot', '1'); } catch { /* stockage indisponible */ }
if (booted || mqReduce.matches) { $('#boot').remove(); setTimeout(welcomeToast, 600); }
else bootScreen(() => setTimeout(welcomeToast, 700));
})();
</script>
