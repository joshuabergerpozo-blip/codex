      <div class="win-title">${o.icon || ''}<span>${esc(o.title)}</span></div>
      <div class="win-tools">${o.tools || ''}</div>
    </header>
    <div class="win-body"></div>
    <div class="win-resize" aria-hidden="true"></div>
  </section>`);
  const body = $('.win-body', el);
  if (typeof o.body === 'string') body.innerHTML = o.body;
  const win = { key: o.key, el, body, app: o.app, node: o.node, title: o.title, min: false, max: false, prev: null, onClose: o.onClose, state: o.state || {} };

  const a = workArea();
  const w = Math.min(o.w || 640, innerWidth - 32);
  const hh = Math.min(o.h || 480, a.h - 16);
  const k = WM.n++ % 6;
  const x = o.x ?? Math.round(clamp((innerWidth - w) / 2 - 90 + k * 30, 16, Math.max(16, innerWidth - w - 16)));
  const y = o.y ?? Math.round(a.y + clamp(26 + k * 26, 8, Math.max(8, a.h - hh)));
  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: hh + 'px' });
  winLayer.append(el);
  WM.list.push(win);
  el.addEventListener('animationend', () => el.classList.remove('opening'), { once: true });
  wireWin(win);
  focusWin(win);
  o.onMount?.(win);
  refreshDock();
  return win;
}

function wireWin(win) {
  const { el } = win;
  const bar = $('.win-bar', el);
  el.addEventListener('pointerdown', () => { if (WM.active !== win) focusWin(win); }, true);
  $('.light.close', el).addEventListener('click', () => closeWin(win));
  $('.light.min', el).addEventListener('click', () => minimizeWin(win));
  $('.light.max', el).addEventListener('click', () => toggleMax(win));
  bar.addEventListener('dblclick', e => { if (!e.target.closest('button, input, .win-tools, .win-lead')) toggleMax(win); });

  bar.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button, input, .win-tools, .win-lead') || isMobile()) return;
    const r = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    let ox = r.left, oy = r.top, moved = false;
    bar.setPointerCapture(e.pointerId);
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved) {
        if (Math.hypot(dx, dy) < 3) return;
        moved = true;
        el.classList.add('dragging');
        if (win.max) {
          const ratio = (sx - r.left) / r.width;
          Object.assign(el.style, { width: win.prev.width, height: win.prev.height });
          win.max = false; el.classList.remove('max');
          ox = sx - ratio * el.offsetWidth;
        }
      }
      const a = workArea();
      el.style.left = Math.round(clamp(ox + dx, 80 - el.offsetWidth, innerWidth - 80)) + 'px';
      el.style.top = Math.round(clamp(oy + dy, a.y, innerHeight - 70)) + 'px';
    };
    const up = () => {
      bar.removeEventListener('pointermove', mv);
      bar.removeEventListener('pointerup', up);
      bar.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
    };
    bar.addEventListener('pointermove', mv);
    bar.addEventListener('pointerup', up);
    bar.addEventListener('pointercancel', up);
  });

  const rz = $('.win-resize', el);
  rz.addEventListener('pointerdown', e => {
    if (isMobile()) return;
    e.preventDefault(); e.stopPropagation();
    focusWin(win);
    const sx = e.clientX, sy = e.clientY, w0 = el.offsetWidth, h0 = el.offsetHeight;
    rz.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const mv = ev => {
      el.style.width = Math.round(clamp(w0 + ev.clientX - sx, 320, innerWidth - el.offsetLeft - 4)) + 'px';
      el.style.height = Math.round(clamp(h0 + ev.clientY - sy, 220, innerHeight - el.offsetTop - 4)) + 'px';
      if (win.max) { win.max = false; el.classList.remove('max'); }
    };
    const up = () => { rz.removeEventListener('pointermove', mv); rz.removeEventListener('pointerup', up); rz.removeEventListener('pointercancel', up); el.classList.remove('dragging'); };
    rz.addEventListener('pointermove', mv);
    rz.addEventListener('pointerup', up);
    rz.addEventListener('pointercancel', up);
  });
}

function focusWin(win) {
  if (!win) return;
  win.el.style.zIndex = ++WM.z;
  WM.list = WM.list.filter(w => w !== win).concat(win);
  WM.list.forEach(w => w.el.classList.toggle('active', w === win));
  WM.active = win;
  setAppName(win.app);
  refreshDock();
}
function blurWins() {
  WM.active = null;
  WM.list.forEach(w => w.el.classList.remove('active'));
  setAppName(null);
}
function topVisible() { return [...WM.list].reverse().find(w => !w.min); }

function closeWin(win) {
  win.onClose?.();
  WM.list = WM.list.filter(w => w !== win);
  win.el.classList.add('closing');
  setTimeout(() => win.el.remove(), mqReduce.matches ? 0 : 150);
  if (WM.active === win) { WM.active = null; const next = topVisible(); next ? focusWin(next) : blurWins(); }
  refreshDock();
}

function toggleMax(win) {
  if (isMobile()) return;
  const el = win.el;
  el.classList.add('anim');
  if (win.max) {
    Object.assign(el.style, win.prev);
    win.max = false; el.classList.remove('max');
  } else {
    win.prev = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
    const a = workArea();
    Object.assign(el.style, { left: '0px', top: a.y + 'px', width: innerWidth + 'px', height: (a.h + 2) + 'px' });
    win.max = true; el.classList.add('max');
  }
  setTimeout(() => el.classList.remove('anim'), 280);
}

function minimizeWin(win) {
  const el = win.el;
  win.min = true;
  refreshDock();
  const target = $(`#dock [data-win="${CSS.escape(win.key)}"]`) || $('#dock');
  const t = target.getBoundingClientRect(), r = el.getBoundingClientRect();
  const done = () => { el.hidden = true; el.style.transition = ''; };
  if (mqReduce.matches) done();
  else {
    el.style.transition = 'transform .4s cubic-bezier(.5,0,.75,.2), opacity .4s ease-in';
    el.style.transformOrigin = 'center';
    el.style.transform = `translate(${t.left + t.width / 2 - (r.left + r.width / 2)}px, ${t.top + t.height / 2 - (r.top + r.height / 2)}px) scale(.05)`;
    el.style.opacity = '0';
    setTimeout(done, 400);
  }
  if (WM.active === win) { WM.active = null; const next = topVisible(); next ? focusWin(next) : blurWins(); }
}
function restoreWin(win) {
  const el = win.el;
  win.min = false;
  el.hidden = false;
  if (!mqReduce.matches) {
    el.style.transition = 'transform .32s cubic-bezier(.2,.8,.3,1), opacity .25s';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = ''; el.style.opacity = ''; }));
    setTimeout(() => { el.style.transition = ''; }, 340);
  } else { el.style.transform = ''; el.style.opacity = ''; }
  focusWin(win);
}
function showWin(win) { win.min ? restoreWin(win) : focusWin(win); return win; }

function setAppName(app) { $('#mb-app').textContent = app ? APPS[app].name : 'Fichiers'; }

/* ---------- Ouvrir un élément ---------- */
function openNode(id) {
  const n = FS[id];
  if (!n) return;
  if (n.kind === 'folder' || n.kind === 'trash') return openFinder(id);
  if (id === 'terminal') return openTerminal();
  const ex = WM.list.find(w => w.key === id);
  if (ex) return showWin(ex);
  const app = APPS[n.app];
  bounceDock(n.app);
  return createWin({
    key: id, node: id, title: n.name, icon: iconSvg(id), app: n.app, cls: 'app-' + n.app,
    w: n.w || app.w, h: n.h || app.h, body: n.render(), tools: app.tools ? app.tools(n) : '',
    onMount: win => app.mount?.(win, n),
  });
}

function mountPdf(win) {
  let z = 1;
  const pages = $$('.page', win.body);
  const lab = $('.zoom-v', win.el);
  const apply = () => { pages.forEach(p => p.style.setProperty('--z', z)); lab.textContent = Math.round(z * 100) + ' %'; };
  const fit = Math.floor(clamp((win.body.clientWidth - 52) / 660, .6, 1) * 10) / 10;
  if (fit < 1) { z = fit; apply(); }
  $('.win-tools', win.el).addEventListener('click', e => {
    const b = e.target.closest('[data-z]');
    if (!b) return;
    z = clamp(Math.round((z + (b.dataset.z === '+' ? .1 : -.1)) * 10) / 10, .6, 1.8);
    apply();
  });
}

function mountTabs(win) {
  win.body.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (!t) return;
    $$('[data-tab]', win.body).forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    $$('[data-pane]', win.body).forEach(p => { p.hidden = p.dataset.pane !== t.dataset.tab; });
  });
}

/* ---------- Explorateur de fichiers ---------- */
function openFinder(folder, force) {
  const ex = !force && WM.list.find(w => w.app === 'finder' && w.state.cur === folder);
  if (ex) return showWin(ex);
  bounceDock('finder');
  const lead = `<button class="tb" data-act="back" aria-label="Précédent">${UI.back}</button><button class="tb" data-act="fwd" aria-label="Suivant">${UI.fwd}</button>`;

  return createWin({
    key: 'finder-' + (++WM.n), app: 'finder', cls: 'finder-win', title: FS[folder].name, icon: iconSvg(folder), w: 800, h: 500, lead, tools,
    state: { cur: folder, back: [], fwd: [], view: store.get('view', 'grid'), sel: null, q: '' },
    body: '<div class="finder"><nav class="f-side" aria-label="Emplacements"></nav><div class="f-main"><div class="f-banner" hidden></div><div class="f-view" tabindex="-1"></div><div class="f-status"></div></div></div>',
    onMount: win => { wireFinder(win); renderFinder(win); },

function renderFinder(win) {
  const s = win.state, n = FS[s.cur];
  win.title = n.name;
  $('.win-title', win.el).innerHTML = iconSvg(s.cur) + `<span>${esc(n.name)}</span>`;
  win.el.setAttribute('aria-label', n.name);
  const side = [['Favoris', [['desktop', 'desktop'], ['stages', 'folder'], ['ateliers', 'folder'], ['perso', 'folder']]], ['Emplacements', [['trash', 'trash']]]];
  $('.f-side', win.el).innerHTML = side.map(([t, ids]) => `<h4>${t}</h4>` + ids.map(([id, ic]) => `<button data-nav="${id}" class="${id === s.cur ? 'on' : ''}">${SIDE_ICONS[ic]}<span>${esc(FS[id].name)}</span></button>`).join('')).join('');
  const banner = $('.f-banner', win.el);
  if (n.banner) {
    banner.hidden = false;
    banner.innerHTML = `<p>${esc(n.banner.text)}</p><button class="btn" data-bact="${n.banner.act}">${esc(n.banner.btn)}</button>`;
  } else banner.hidden = true;
  const q = norm(s.q.trim());
  const kids = n.children.filter(id => !q || norm(FS[id].name + ' ' + (FS[id].kw || '')).includes(q));
  const view = $('.f-view', win.el);
  if (!kids.length) view.innerHTML = `<div class="f-empty">${q ? 'Aucun élément ne correspond.' : 'Ce dossier est vide.'}</div>`;
  else if (s.view === 'list') {
    view.innerHTML = `<table class="f-table"><thead><tr><th>Nom</th><th>Type</th><th>Statut</th></tr></thead><tbody>${kids.map(id => `<tr class="f-row${s.sel === id ? ' sel' : ''}" data-id="${id}" tabindex="0"><td><span class="cell">${iconSvg(id)}<span>${esc(FS[id].name)}</span></span></td><td>${esc(FS[id].type || '')}</td><td>${chip(FS[id].status)}</td></tr>`).join('')}</tbody></table>`;
  } else {
    view.innerHTML = `<div class="f-grid">${kids.map(id => `<div class="f-item${s.sel === id ? ' sel' : ''}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(FS[id].name)}"><span class="pic">${iconSvg(id)}</span><span class="n">${breakName(FS[id].name)}</span></div>`).join('')}</div>`;
  }
  $('.f-status', win.el).innerHTML = `<span>${kids.length} élément${kids.length > 1 ? 's' : ''}</span><span>${s.sel ? esc(FS[s.sel].desc || '') : esc(n.desc || '')}</span>`;
  $('[data-act="back"]', win.el).disabled = !s.back.length;
  $('[data-act="fwd"]', win.el).disabled = !s.fwd.length;
  $('[data-act="grid"]', win.el).classList.toggle('on', s.view !== 'list');
  $('[data-act="list"]', win.el).classList.toggle('on', s.view === 'list');
}

function finderNav(win, id) {
  const s = win.state;
  if (id === s.cur) return;
  s.back.push(s.cur); s.fwd = []; s.cur = id; s.sel = null; s.q = '';
  $('.f-search', win.el).value = '';
  renderFinder(win);
}
function setFinderView(win, v) { win.state.view = v; store.set('view', v); renderFinder(win); }

function wireFinder(win) {
  const s = win.state;
  const openItem = id => { const n = FS[id]; (n.kind === 'folder' || n.kind === 'trash') ? finderNav(win, id) : openNode(id); };
  win.el.querySelector('.win-bar').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'back' && s.back.length) { s.fwd.push(s.cur); s.cur = s.back.pop(); s.sel = null; }
    if (a === 'fwd' && s.fwd.length) { s.back.push(s.cur); s.cur = s.fwd.pop(); s.sel = null; }
    if (a === 'grid' || a === 'list') return setFinderView(win, a);
    renderFinder(win);
  });
  $('.f-search', win.el).addEventListener('input', e => { s.q = e.target.value; renderFinder(win); });
  const fm = $('.finder', win.el);
  fm.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) return finderNav(win, nav.dataset.nav);
    const ba = e.target.closest('[data-bact]');
    if (ba) {
      const act = ba.dataset.bact;
      if (act === 'empty') return sheet(win, { icon: ICONS.trash(true), title: 'Vider la corbeille ?', text: 'Impossible : ces deux projets m’ont appris à choisir des fournisseurs, à gérer une boutique et à construire un logiciel. Ils restent ici.', buttons: [{ label: 'Les garder', primary: true }] });
      if (act.startsWith('open:')) return finderNav(win, act.slice(5));
    }
    const it = e.target.closest('[data-id]');
    if (it) { s.sel = it.dataset.id; $$('[data-id]', fm).forEach(x => x.classList.toggle('sel', x === it)); $('.f-status span:last-child', win.el).textContent = FS[s.sel].desc || ''; }
    else if (e.target.closest('.f-view')) { s.sel = null; $$('[data-id]', fm).forEach(x => x.classList.remove('sel')); }
  });
  fm.addEventListener('dblclick', e => { const it = e.target.closest('[data-id]'); if (it) openItem(it.dataset.id); });
  fm.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') return; const it = e.target.closest('[data-id]'); if (it) openItem(it.dataset.id); });
  fm.addEventListener('keydown', e => { const it = e.target.closest('[data-id]'); if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openItem(it.dataset.id); } });
  fm.addEventListener('contextmenu', e => {
    const it = e.target.closest('[data-id]');
    if (!it) return;
    e.preventDefault();
    const id = it.dataset.id;
    showMenu([{ label: 'Ouvrir', action: () => openItem(id) }, { label: 'Lire les informations', kbd: `${MOD} I`, action: () => openInfo(id) }], e.clientX, e.clientY);
  });
}

function sheet(win, { icon, title, text, buttons }) {
  const bg = h(`<div class="sheet-bg"><div class="sheet" role="alertdialog" aria-label="${esc(title)}">${icon || ''}<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"></div></div></div>`);
  const close = () => bg.remove();
  buttons.forEach(b => {
    const el = h(`<button class="btn${b.primary ? ' primary' : ''}">${esc(b.label)}</button>`);
    el.addEventListener('click', () => { close(); b.action?.(); });
    $('.acts', bg).append(el);
  });
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  win.el.append(bg);
  $('.btn.primary', bg)?.focus();
}

function resolve(arg, cwd) {
  if (!arg) return null;
  let a = norm(arg).replace(/\/+$/, '').replace(/^\.\//, '');
  if (['~', '~/bureau', 'bureau', '/'].includes(a)) return 'desktop';
  if (a === '..') return PARENT[cwd] || 'desktop';
  if (a === '.') return cwd;
  if (['corbeille', '.corbeille', '~/.corbeille', 'trash'].includes(a)) return 'trash';
  a = a.split('/').filter(Boolean).pop() || a;
  const match = id => { const nm = norm(FS[id].name); return nm === a || nm.replace(/\.[a-z]+$/, '') === a || id === a; };
  const local = (FS[cwd].children || []).find(match);
  if (local) return local;
  return Object.keys(FS).find(match) || Object.keys(FS).find(id => norm(FS[id].name).startsWith(a)) || null;
}

    if (f) f(arg, arg);

  print('');
  if (!isMobile()) setTimeout(() => inp.focus({ preventScroll: true }), 60);
}

const SLOT_W = 104, SLOT_H = 112;
const iconsEl = $('#icons');
let iconPos = store.get('icons2', {});
const breakName = s => esc(s).replace(/([_.])/g, '$1<wbr>');

function renderIcons() {
  iconsEl.innerHTML = FS.desktop.children.map(id => `<div class="icon" role="button" tabindex="0" data-id="${id}" aria-label="${esc(FS[id].name)}"><span class="pic">${iconSvg(id)}</span><span class="n">${breakName(FS[id].name)}</span></div>`).join('');
  layoutIcons();
}
function iconGrid() {
  const a = workArea();
  const widgets = $('#widgets');
  const right = widgets.offsetParent ? widgets.getBoundingClientRect().left - 12 : innerWidth - 8;
  return { top: a.y + 8, left: 14, rows: Math.max(1, Math.floor((a.h - 8) / SLOT_H)), cols: Math.max(1, Math.floor((right - 14) / SLOT_W)) };
}
const slotXY = (c, r, g) => ({ x: g.left + c * SLOT_W, y: g.top + r * SLOT_H });
function layoutIcons() {
  const all = $$('.icon', iconsEl);
  if (isMobile()) { iconsEl.classList.add('flow'); all.forEach(el => { el.style.left = el.style.top = ''; }); return; }
  iconsEl.classList.remove('flow');
  const g = iconGrid(), taken = new Set(), place = {};
  FS.desktop.children.forEach(id => {
    const p = iconPos[id];
    if (p && p.c < g.cols && p.r < g.rows && !taken.has(p.c + ',' + p.r)) { place[id] = p; taken.add(p.c + ',' + p.r); }
  });
  let i = 0;
  FS.desktop.children.forEach(id => {
    if (place[id]) return;
    while (taken.has((i % g.cols) + ',' + Math.floor(i / g.cols))) i++;
    place[id] = { c: i % g.cols, r: Math.floor(i / g.cols) };
    taken.add(place[id].c + ',' + place[id].r);
  });
  all.forEach(el => {
    const p = place[el.dataset.id], { x, y } = slotXY(p.c, p.r, g);
    el._slot = p; el.style.left = x + 'px'; el.style.top = y + 'px';
  });
}
function snapIcons(group) {
  const g = iconGrid();
  const moving = new Set(group.map(x => x.el));
  const taken = new Set($$('.icon', iconsEl).filter(el => !moving.has(el)).map(el => el._slot.c + ',' + el._slot.r));
  group.forEach(({ el }) => {
    const c0 = clamp(Math.round((el.offsetLeft - g.left) / SLOT_W), 0, g.cols - 1);
    const r0 = clamp(Math.round((el.offsetTop - g.top) / SLOT_H), 0, g.rows - 1);
    let best = null, bd = Infinity;
    for (let c = 0; c < g.cols; c++) for (let r = 0; r < g.rows; r++) {
      if (taken.has(c + ',' + r)) continue;
      const d = (c - c0) ** 2 + (r - r0) ** 2;
      if (d < bd) { bd = d; best = { c, r }; }
    }
    if (best) { el._slot = best; taken.add(best.c + ',' + best.r); }
  });
  iconPos = {};
  $$('.icon', iconsEl).forEach(el => { iconPos[el.dataset.id] = el._slot; });
  store.set('icons2', iconPos);
  layoutIcons();
}
const selectIcons = ids => $$('.icon', iconsEl).forEach(el => el.classList.toggle('sel', ids.includes(el.dataset.id)));
const selectedIcons = () => $$('.icon.sel', iconsEl).map(el => el.dataset.id);

iconsEl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.icon');
  if (!el) return;
  e.stopPropagation();
  closeMenus();
  blurWins();
  const id = el.dataset.id;
  if (e.shiftKey || e.metaKey || e.ctrlKey) el.classList.toggle('sel');
  else if (!el.classList.contains('sel')) selectIcons([id]);
  if (e.button !== 0) return;
  const sx = e.clientX, sy = e.clientY;
  const group = $$('.icon.sel', iconsEl).map(i => ({ el: i, x: i.offsetLeft, y: i.offsetTop }));
  const trashBtn = $('#dock [data-dock="trash"]');
  let dragging = false, overTrash = false;
  el.setPointerCapture(e.pointerId);
  const mv = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!dragging) {
      if (isMobile() || Math.hypot(dx, dy) < 5) return;
      dragging = true;
      group.forEach(g => g.el.classList.add('dragging'));
    }
    group.forEach(g => { g.el.style.left = g.x + dx + 'px'; g.el.style.top = g.y + dy + 'px'; });
    const tr = trashBtn.getBoundingClientRect();
    overTrash = ev.clientX >= tr.left && ev.clientX <= tr.right && ev.clientY >= tr.top && ev.clientY <= tr.bottom;
    trashBtn.classList.toggle('drop', overTrash);
  };
  const up = ev => {
    el.removeEventListener('pointermove', mv);
    el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', up);
    trashBtn.classList.remove('drop');
    group.forEach(g => g.el.classList.remove('dragging'));
    if (dragging) { if (overTrash) { layoutIcons(); trashToast(); } else snapIcons(group); }
    else if (ev.type === 'pointerup' && ev.pointerType !== 'mouse') openNode(id);
  };
  el.addEventListener('pointermove', mv);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
});

iconsEl.addEventListener('keydown', e => {

    if (it.head) return m.append(h(`<div class="m-head">${esc(it.head)}</div>`));

  m.style.top = clamp(y, 4, innerHeight - m.offsetHeight - 8) + 'px';
  m.addEventListener('keydown', e => {
    const bs = $$('button:not(:disabled)', m), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  });
  openMenu = { el: m, anchor };
  anchor?.classList.add('open');
  return m;
}

function tick() {
  const d = new Date();
  let day = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  day = day.charAt(0).toUpperCase() + day.slice(1);
  const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  $('#clock').innerHTML = `<span class="d">${esc(day)}&nbsp;&nbsp;</span>${esc(time)}`;
}

document.addEventListener('keydown', e => {
  if (isLocked()) return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey && (e.metaKey || e.altKey) && (k === 'q' || k === 'l')) { e.preventDefault(); showLock(); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); spot.hidden ? openSpot() : closeSpot(); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'i') {
    const id = selectedIcons()[0] || WM.active?.node;
    if (id) { e.preventDefault(); openInfo(id); }
    return;
  }
  if (e.key === 'Escape') {
    if (!spot.hidden) return closeSpot();
    if (openMenu) return closeMenus();
    if (!launch.hidden) return closeLaunch();
    const sh = WM.active && $('.sheet-bg', WM.active.el);
    if (sh) return sh.remove();
  }
  if (e.altKey && !e.metaKey && !e.ctrlKey) {
    if (e.code === 'KeyW' && WM.active) { e.preventDefault(); closeWin(WM.active); }
    if (e.code === 'KeyM' && WM.active) { e.preventDefault(); minimizeWin(WM.active); }
    if (e.code === 'KeyT') { e.preventDefault(); openTerminal(); }
  }
});

function mountBrowser(win) {
  const s = win.state, view = $('.bw-view', win.el), inp = $('.bw-addr input', win.el), tabT = $('.bw-tab-t', win.el);
  const render = () => {
    const page = s.hist[s.idx];
    let title = 'Page de démarrage', addr = '';
    if (page === 'home') view.innerHTML = bwHome();
    else if (page.startsWith('q:')) { const q = page.slice(2); title = q; addr = q; view.innerHTML = bwSearch(q); }
    else { const n = FS[page]; title = prettyName(n.name); addr = `${BW_HOST}/${slug(n.name)}`; view.innerHTML = `<div class="bw-page">${n.render()}</div>`; }
    view.scrollTop = 0;
    inp.value = addr;
    if (tabT) tabT.textContent = title;
    $('[data-bw="back"]', win.el).disabled = s.idx <= 0;
    $('[data-bw="fwd"]', win.el).disabled = s.idx >= s.hist.length - 1;
  };
  const go = page => { s.hist = s.hist.slice(0, s.idx + 1); s.hist.push(page); s.idx = s.hist.length - 1; render(); };
  win.go = go;
  $('.bw-bar', win.el).addEventListener('click', e => {
    const b = e.target.closest('[data-bw]');
    if (!b || b.disabled) return;
    const a = b.dataset.bw;
    if (a === 'back' && s.idx > 0) { s.idx--; render(); }
    if (a === 'fwd' && s.idx < s.hist.length - 1) { s.idx++; render(); }
    if (a === 'home') go('home');
    if (a === 'reload') render();
  });
  $('.bw-addr', win.el).addEventListener('submit', e => {
    e.preventDefault();
    const q = inp.value.trim();
    if (!q) return go('home');
    const key = norm(q).replace(new RegExp('^(https?://)?' + BW_HOST.replace('.', '\\.') + '/?'), '');
    const exact = bwPageIds().find(id => [slug(FS[id].name), norm(FS[id].name), norm(prettyName(FS[id].name))].includes(key));
    exact ? go(exact) : go('q:' + q);
    inp.blur();
  });
  inp.addEventListener('focus', () => inp.select());
  view.addEventListener('click', e => {
    const g = e.target.closest('[data-bwgo]');
    if (g) return go(g.dataset.bwgo);
    const t = e.target.closest('[data-tab]');
    if (t) {
      const root = t.closest('.tt') || view;
      $$('[data-tab]', root).forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
      $$('[data-pane]', root).forEach(p => { p.hidden = p.dataset.pane !== t.dataset.tab; });
    }
  });
  go('home');
}

/* ---------- Musique (sons générés en direct) ---------- */
const TRACKS = [
  { id: 'vagues', title: 'Vagues de Hossegor', artist: 'Océan Atlantique', cover: 'assets/fond-jour.webp' },
  { id: 'fjord', title: 'Fjord au petit matin', artist: 'Ambiance', cover: 'assets/fond-fjord.webp' },
  { id: 'nuit', title: 'Crépuscule sur la dune', artist: 'Ambiance', cover: 'assets/fond-nuit.webp' },
];
const CHORDS = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 55, 59, 64], [55, 59, 62, 64]];
const audio = { ctx: null, master: null, bus: null, nodes: [], timers: [], cur: 0, playing: false, vol: .7, started: 0, win: null };
function audioCtx() {
  if (!audio.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = audio.vol;
    audio.master.connect(audio.ctx.destination);
  }
  return audio.ctx;
}
function brownNoise(ctx) {
  const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  return buf;
}
function genWaves(ctx, out, level = 1) {
  const src = ctx.createBufferSource(); src.buffer = brownNoise(ctx); src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.Q.value = .2;
  const g = ctx.createGain(); g.gain.value = .34 * level;
  const lfo = ctx.createOscillator(); lfo.frequency.value = .1;
  const lfoG = ctx.createGain(); lfoG.gain.value = .3 * level;
  const lfo2G = ctx.createGain(); lfo2G.gain.value = 480;
  lfo.connect(lfoG).connect(g.gain); lfo.connect(lfo2G).connect(lp.frequency);
  src.connect(lp).connect(g).connect(out);
  src.start(); lfo.start();
  audio.nodes.push(src, lfo);
}
function genPad(ctx, out, { dur = 4.5, shift = 0, level = 1, bright = 1500 } = {}) {
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = bright;
  const dl = ctx.createDelay(1); dl.delayTime.value = .34;
  const fb = ctx.createGain(); fb.gain.value = .4;
  const wet = ctx.createGain(); wet.gain.value = .32;
  lp.connect(out); lp.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(out);
  let i = 0;
  const chord = () => {
    const t = ctx.currentTime + .05;
    CHORDS[i++ % CHORDS.length].forEach(m => {
      const f = 440 * 2 ** ((m + shift - 69) / 12);
      [['triangle', 1, .04], ['sine', 2, .014]].forEach(([type, mul, amp]) => {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * mul; o.detune.value = (Math.random() - .5) * 10;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp * level, t + 1.3); g.gain.setTargetAtTime(0, t + dur - .3, .7);
        o.connect(g).connect(lp); o.start(t); o.stop(t + dur + 3);
      });
    });
  };
  chord();
  audio.timers.push(setInterval(chord, dur * 1000));
  audio.nodes.push({ stop() { lp.disconnect(); dl.disconnect(); } });
}
const GENERATORS = {
  vagues: (ctx, out) => genWaves(ctx, out, 1),
  fjord: (ctx, out) => { genPad(ctx, out, { dur: 4.5 }); genWaves(ctx, out, .22); },
  nuit: (ctx, out) => { genPad(ctx, out, { dur: 6.5, shift: -12, level: 1.25, bright: 900 }); genWaves(ctx, out, .45); },
};
function stopAudio() {
  clearInterval(audio.tick);
  if (!audio.bus) return;
  const { bus, nodes, timers } = audio;
  timers.forEach(clearInterval);
  const now = audio.ctx.currentTime;
  bus.gain.cancelScheduledValues(now); bus.gain.setValueAtTime(bus.gain.value, now); bus.gain.setTargetAtTime(0, now, .15);
  setTimeout(() => { nodes.forEach(n => { try { n.stop(); } catch { /* déjà arrêté */ } }); try { bus.disconnect(); } catch { /* déjà déconnecté */ } }, 800);
  audio.bus = null; audio.nodes = []; audio.timers = [];
}
function playTrack(i) {
  const ctx = audioCtx();
  if (!ctx) { toast('Musique', 'Ce navigateur ne peut pas jouer de son.', { icon: APP_ICONS.music() }); return; }
  ctx.resume?.();
  stopAudio();
  audio.cur = (i + TRACKS.length) % TRACKS.length;
  audio.playing = true;
  const bus = ctx.createGain(), now = ctx.currentTime;
  bus.gain.setValueAtTime(0, now); bus.gain.linearRampToValueAtTime(1, now + 1.5);

}
function pauseAudio() { stopAudio(); audio.playing = false; muUpdate(); }
function muUpdate() {
  const win = audio.win;
  if (!win) return;
  const t = TRACKS[audio.cur];
  $$('.mu-row', win.el).forEach((r, i) => r.classList.toggle('on', audio.playing && i === audio.cur));
  $('.mu', win.el).classList.toggle('paused', !audio.playing);

  $('.mu-now .art', win.el).style.backgroundImage = `url("${t.cover}")`;
  $('.mu-now b', win.el).textContent = t.title;
  const sec = audio.playing ? Math.floor((Date.now() - audio.started) / 1000) : 0;
  $('.mu-now small', win.el).textContent = audio.playing ? `${t.artist} · ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : `${t.artist} · en pause`;
}

        <ol class="mu-list">${TRACKS.map((t, i) => `<li><button class="mu-row" data-track="${i}"><span class="n">${i + 1}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="art" style="background-image:url('${t.cover}')"></span><span><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></span><span class="d">En continu</span></button></li>`).join('')}</ol>
        <p class="mu-note">Ces ambiances sont composées en direct par l’ordinateur, à partir des lieux de mon parcours.</p>

        <div class="mu-ctl"><button data-mu="prev" aria-label="Titre précédent">${UI.prev}</button><button class="pp" data-mu="pp" aria-label="Lecture">${UI.play}</button><button data-mu="next" aria-label="Titre suivant">${UI.next}</button></div>

      draw('all');
    },
  });
}

/* ---------- Applications (grille plein écran) ---------- */
const LP_APPS = [
  ['finder', 'Fichiers', () => openFinder('desktop')], ['compass', 'Safari', () => openBrowser('compass')], ['orbit', 'Google Chrome', () => openBrowser('orbit')], ['mail', 'Mail', () => openMail()], ['appstore', 'App Store', () => openAppStore()],
  ['music', 'Musique', () => openMusic()], ['notes', 'Notes', () => openNode('lisezmoi')], ['pdf', 'Aperçu', () => openNode('stage1')],
  ['slides', 'Présentation', () => openNode('heinz')], ['video', 'Vidéo', () => openNode('coworking')], ['tiktok', 'TikTok Droit', () => openNode('tiktok')],
  ['shop', 'Le Vélo Havrais', () => openNode('velo')], ['saas', 'Studio IA PME', () => openNode('saas')], ['terminal', 'Terminal', () => openTerminal()],
  ['settings', 'Réglages Système', () => openSettings()],
];
const launch = h('<div id="launch" role="dialog" aria-label="Applications" hidden><div class="lp-search"><input type="text" placeholder="Rechercher" aria-label="Rechercher une application" autocomplete="off" spellcheck="false"></div><div class="lp-grid"></div><div class="lp-dots" aria-hidden="true"><i></i></div></div>');
$('#os').append(launch);
const lpInput = $('input', launch);
function renderLaunch(q = '') {
  const n = norm(q.trim());
  const list = LP_APPS.filter(a => !n || norm(a[1]).includes(n));
  $('.lp-grid', launch).innerHTML = list.length
    ? list.map((a, i) => `<button class="lp-item" data-lp="${a[0]}" style="animation-delay:${i * 15}ms">${APP_ICONS[a[0]]()}<span>${esc(a[1])}</span></button>`).join('')
    : '<p class="lp-empty">Aucune application ne correspond.</p>';
}
function openLaunch() {
  closeMenus(); closeSpot();
  lpInput.value = '';
  renderLaunch();
  launch.classList.remove('out');
  launch.hidden = false;
  if (!isMobile()) setTimeout(() => lpInput.focus({ preventScroll: true }), 60);
}
function closeLaunch() {
  if (launch.hidden || launch.classList.contains('out')) return;
  launch.classList.add('out');
  setTimeout(() => { launch.hidden = true; launch.classList.remove('out'); }, mqReduce.matches ? 0 : 200);
}
function toggleLaunch() { launch.hidden ? openLaunch() : closeLaunch(); }
launch.addEventListener('click', e => {
  const b = e.target.closest('[data-lp]');
  if (b) { const a = LP_APPS.find(x => x[0] === b.dataset.lp); closeLaunch(); setTimeout(a[2], 140); return; }
  if (!e.target.closest('input')) closeLaunch();
});
lpInput.addEventListener('input', () => renderLaunch(lpInput.value));
lpInput.addEventListener('keydown', e => { if (e.key === 'Enter') $('.lp-item', launch)?.click(); });

/* =========================================================
   Écran de connexion
   ========================================================= */
const lock = $('#lock'), lkForm = $('#lk-form'), lkPass = $('#lk-pass'), lkField = $('#lk-field'), lkSub = $('#lk-sub'), lkHint = $('#lk-hint');
const LK_SUB = 'Touch ID ou saisissez le mot de passe';
const LK_HINT = 'Indice : n’importe quel mot de passe ouvre la session.';
let fails = 0, hintTimer = 0, welcomed = false;
const isLocked = () => !lock.hidden;
function lockTick() {
  const d = new Date();
  const ds = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#lk-date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  $('#lk-time').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function showLock() {
  closeMenus(); closeSpot(); closeLaunch();
  $('.lk-bg', lock).style.backgroundImage = getComputedStyle(desk).backgroundImage;
  lock.hidden = false;
  lock.classList.remove('out');
  lkPass.value = ''; lkPass.disabled = false;
  lkField.classList.remove('has', 'busy', 'shake');
  $('.lk-spin', lock).hidden = true;
  lkHint.hidden = true; lkSub.textContent = LK_SUB; fails = 0;
  lockTick();
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { lkHint.hidden = false; }, 6000);
  if (!isMobile()) setTimeout(() => lkPass.focus({ preventScroll: true }), 80);
}
function unlock() {
  lkField.classList.add('busy');
  $('.lk-spin', lock).hidden = false;
  lkPass.disabled = true;
  clearTimeout(hintTimer);
  setTimeout(() => {
    lock.classList.add('out');
    if (!mqReduce.matches) $('#os').classList.add('waking');
    setTimeout(() => {
      lock.hidden = true;
      $('#os').classList.remove('waking');
      lkPass.blur();
      if (!welcomed) { welcomed = true; setTimeout(welcomeToast, 500); }
    }, mqReduce.matches ? 0 : 650);
  }, 700);
}
function logout() {
  pauseAudio(); audio.win = null;
  [...WM.list].forEach(w => w.el.remove());
  WM.list = []; WM.active = null; WM.n = 0;
  blurWins(); refreshDock(); selectIcons([]);
  showLock();
}
lkForm.addEventListener('submit', e => {
  e.preventDefault();
  if (lkField.classList.contains('busy')) return;
  if (lkPass.value) return unlock();
  fails++;
  lkField.classList.remove('shake'); void lkField.offsetWidth; lkField.classList.add('shake');
  lkHint.hidden = false;
  if (fails >= 2) lkSub.textContent = LK_HINT;
  lkPass.focus();
});
lkField.addEventListener('animationend', () => lkField.classList.remove('shake'));
lkPass.addEventListener('input', () => lkField.classList.toggle('has', !!lkPass.value));
lkHint.addEventListener('click', () => { lkSub.textContent = LK_HINT; lkPass.focus(); });
lock.addEventListener('pointerdown', e => { if (!e.target.closest('button, input')) { e.preventDefault(); if (!isMobile()) lkPass.focus(); } });
document.addEventListener('keydown', e => {
  if (!isLocked() || document.activeElement === lkPass) return;
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) lkPass.focus();
}, true);
$('#lk-batt').innerHTML = UI.batt;
$('#lk-wifi').innerHTML = UI.wifi;
setInterval(() => { if (isLocked()) lockTick(); }, 5000);

/* =========================================================
   Démarrage
   ========================================================= */
function welcomeToast() {
  toast('Joshua Berger', `<b style="display:inline;font-size:13px">${esc(MAILS[0].subject)}</b><br>${isMobile() ? 'Touchez ici pour lire le message, ou une icône pour l’ouvrir.' : 'Cliquez ici pour lire le message, ou double-cliquez sur une icône du bureau.'}`, { icon: APP_ICONS.mail(), action: () => openMail(0), ms: 10000 });
}
function bootScreen(onDone) {
  let b = $('#boot');
  if (!b) {
    b = h(`<div id="boot"><div class="boot-inner"><span class="logo">${UI.logo}</span><div class="boot-bar"><i></i></div></div></div>`);
    document.body.append(b);
  } else $('#boot-logo').innerHTML = UI.logo;
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    b.classList.add('done');
    setTimeout(() => b.remove(), 620);
    onDone?.();
  };
  b.addEventListener('click', finish);
  setTimeout(finish, mqReduce.matches ? 0 : 1600);
}
function restart() {
  closeMenus();
  pauseAudio(); audio.win = null;
  [...WM.list].forEach(w => { w.el.remove(); });
  WM.list = []; WM.active = null; WM.n = 0;
  blurWins(); refreshDock();
  showLock();
  bootScreen(() => { if (!isMobile()) lkPass.focus({ preventScroll: true }); });
}

$('#mb-logo').innerHTML = UI.logo;
$('#mb-search').innerHTML = UI.search;
$('#mb-cc').innerHTML = UI.cc;
$('#mb-wifi').innerHTML = UI.wifi;
$('#mb-batt').innerHTML = UI.batt;
refreshDock();
renderWidgets();
renderIcons();
tick(); setInterval(tick, 15000);

let booted = false;
try { booted = sessionStorage.getItem('joshos:boot') === '1'; sessionStorage.setItem('joshos:boot', '1'); } catch { /* stockage indisponible */ }
showLock();
if (booted || mqReduce.matches) $('#boot').remove();
else bootScreen(() => { if (!isMobile()) lkPass.focus({ preventScroll: true }); });
})();
</script>
</body>
